<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">Repotra app icon</title>
  <desc id="description">A folded blue and violet note with writing lines and a cursor on a graphite rounded square.</desc>
  <defs>
